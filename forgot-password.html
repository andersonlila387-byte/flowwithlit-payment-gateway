<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Flowwithlit</title>
  <meta name="description" content="Reset your Flowwithlit account password using a 6-digit verification code sent to your email." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Smooch+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            sans: ['"Smooch Sans"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          },
          colors: {
            brand: { 
              50: '#eef4ff', 
              100: '#d4e3ff', 
              200: '#a8c7fa',
              500: '#0b2545', 
              600: '#071930', 
              700: '#041124' 
            },
            mint: '#eef4ff',
            ink: '#0a121e',
          },
        },
      },
    };
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      font-size: 17px;
    }
    body { 
      font-family: 'Smooch Sans', sans-serif; 
      font-weight: 600;
      letter-spacing: 0.025em;
      color: #0a121e; 
      -webkit-font-smoothing: antialiased;
    }
    .text-xs {
      font-size: 0.875rem !important;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .text-\[10px\], .text-\[11px\] {
      font-size: 0.8125rem !important;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .text-sm {
      font-size: 1.025rem !important;
    }
    .hero-bg {
      background-image: linear-gradient(180deg, rgba(10,18,30,0.7) 0%, rgba(10,18,30,0.85) 100%), url('images/75nmeaVY0yWUShlVFysSmJb9Q.png');
      background-size: cover; 
      background-position: center;
    }
    details summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-ink antialiased min-h-screen flex flex-col justify-between hero-bg">

  <!-- HEADER -->
  <header class="w-full py-4 px-6 z-50">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index" class="flex items-center gap-2.5">
        <img src="logo/full-logo.png" alt="Flowwithlit" class="h-12 sm:h-14 w-auto object-contain" />
      </a>
      <div class="flex items-center gap-6 text-sm text-white/80">
        <a href="login" class="hover:text-white transition">Sign In</a>
      </div>
    </nav>
  </header>

  <!-- MAIN RESET PASSWORD CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md bg-white rounded-2xl p-6 sm:p-8 shadow-2xl border border-blue-100">
      
      <!-- Icon & Title -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-[#eef4ff] text-[#0b2545] border border-blue-200 flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-[#0b2545]">Reset Password</h1>
        <p class="text-xs text-slate-500 mt-1">Enter your registered email address to receive a 6-digit recovery code</p>
      </div>

      <!-- Demo OTP Helper Toast -->
      <div id="demo-otp-banner" class="hidden mb-5 p-3 rounded-xl text-xs font-mono bg-blue-50 border border-blue-200 text-blue-900 text-center">
        <span class="font-semibold block text-[10px] uppercase text-blue-700 tracking-wider">Demo Helper Reset Code</span>
        <span id="demo-otp-code" class="text-base font-bold text-[#0b2545] tracking-widest">123456</span>
      </div>

      <!-- Alert Message Box -->
      <div id="alert-box" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border border-red-200 bg-red-50 text-red-700"></div>

      <!-- STEP 1: Request Reset Code -->
      <form id="request-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="name@company.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-900 focus:outline-none focus:border-[#0b2545] focus:bg-white transition" />
        </div>

        <button type="submit" id="request-btn" class="w-full flex items-center justify-center gap-2 bg-[#0b2545] hover:bg-[#071930] text-white text-xs font-semibold py-3 px-4 rounded-xl shadow-md transition group">
          <span id="req-btn-text">Send Reset Code</span>
          <svg id="req-btn-arrow" class="w-4 h-4 group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- STEP 2: Verify Code & Set New Password (Hidden until request sent) -->
      <form id="reset-form" class="space-y-4 hidden mt-4">
        <div>
          <label for="reset-code" class="block text-xs font-semibold text-slate-700 mb-1">6-Digit Verification Code</label>
          <input type="text" id="reset-code" required maxlength="6" placeholder="123456" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-center tracking-widest font-mono text-slate-900 focus:outline-none focus:border-[#0b2545] focus:bg-white transition" />
        </div>

        <div>
          <label for="new-password" class="block text-xs font-semibold text-slate-700 mb-1">New Password (Min 8 Chars)</label>
          <input type="password" id="new-password" required minlength="8" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-900 focus:outline-none focus:border-[#0b2545] focus:bg-white transition" />
        </div>

        <button type="submit" id="reset-btn" class="w-full flex items-center justify-center gap-2 bg-[#0b2545] hover:bg-[#071930] text-white text-xs font-semibold py-3 px-4 rounded-xl shadow-md transition group">
          <span id="res-btn-text">Update Password & Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Back to login -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Remembered your password? <a href="login" class="font-bold text-[#0b2545] hover:underline">Return to Sign In</a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full py-4 px-6 text-center text-xs text-white/60 z-50">
    &copy; 2026 Flowwithlit Payments Inc. All rights reserved. &bull; <a href="privacy" class="hover:text-white transition">Privacy</a> &bull; <a href="terms" class="hover:text-white transition">Terms</a>
  </footer>

  <script>
    const alertBox     = document.getElementById('alert-box');
    const requestForm  = document.getElementById('request-form');
    const resetForm    = document.getElementById('reset-form');
    const requestBtn   = document.getElementById('request-btn');
    const reqBtnText   = document.getElementById('req-btn-text');

    function showAlert(msg, isSuccess = false) {
      alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
      if (isSuccess) {
        alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
      } else {
        alertBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      }
      alertBox.innerHTML = msg;
    }

    // Request Code Handler
    requestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      requestBtn.disabled = true;
      reqBtnText.innerText = 'Generating Recovery Code...';
      alertBox.classList.add('hidden');

      try {
        const res = await fetch('api/auth/forgot-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.otp_simulated) {
            document.getElementById('demo-otp-banner').classList.remove('hidden');
            document.getElementById('demo-otp-code').innerText = data.otp_simulated;
          }
          showAlert('Reset code sent! Enter the 6-digit code below and set your new password.', true);
          requestForm.classList.add('hidden');
          resetForm.classList.remove('hidden');
        } else {
          showAlert(data.error || 'Request failed. Please check your email address.');
          requestBtn.disabled = false;
          reqBtnText.innerText = 'Send Reset Code';
        }
      } catch (err) {
        showAlert('Network error sending reset request.');
        requestBtn.disabled = false;
        reqBtnText.innerText = 'Send Reset Code';
      }
    });

    // Reset Password Handler
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const code  = document.getElementById('reset-code').value.trim();
      const new_password = document.getElementById('new-password').value;

      try {
        const res = await fetch('api/auth/reset-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, new_password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Password updated successfully! Redirecting to sign in...', true);
          setTimeout(() => {
            window.location.href = 'login';
          }, 1500);
        } else {
          showAlert(data.error || 'Failed to reset password. Please check the code.');
        }
      } catch (err) {
        showAlert('Network error connecting to reset password server.');
      }
    });
  </script>
</body>
</html>
